server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /client/ {
        proxy_pass https://qa.cloudstack.cloud;
        proxy_ssl_server_name on;
        proxy_set_header Host qa.cloudstack.cloud;
        proxy_cookie_domain qa.cloudstack.cloud $host;
        proxy_redirect https://qa.cloudstack.cloud/ /;
        add_header Cache-Control "no-store" always;
    }
}
