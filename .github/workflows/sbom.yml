name: generate sboms

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-sbom:
    name: ui sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Generate UI SBOM
        # dev dependencies are build tooling and are not shipped in the UI bundle
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --omit dev \
            --spec-version 1.6 --output-format JSON --output-file sbom.ui.cdx.json ui/package.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-ui
          path: sbom.ui.cdx.json

  java-sbom:
    name: java sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Generate Java SBOM
        run: mvn -B -ntp -Dnoredist -Psbom validate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-java
          path: target/ACS.sbom.*

  marvin-sbom:
    name: marvin sbom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          install-python: 'true'

      - name: Resolve marvin dependencies
        run: |
          # marvin's `packages` list includes the generated marvin.cloudstackAPI
          # module, which is created at build time from the API spec and isn't
          # checked in, so setup.py can't be built directly. Read the declared
          # install_requires instead of building the package.
          python3 -c "
          import ast
          tree = ast.parse(open('tools/marvin/setup.py').read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and getattr(node.func, 'id', None) == 'setup':
                  for kw in node.keywords:
                      if kw.arg == 'install_requires':
                          for elt in kw.value.elts:
                              print(elt.value)
          " > marvin-install-requires.txt
          python3 -m venv marvin-venv
          marvin-venv/bin/pip install --quiet -r marvin-install-requires.txt

      - name: Generate marvin SBOM
        # the generator gets its own venv so it doesn't end up in marvin's SBOM
        run: |
          python3 -m venv sbom-venv
          sbom-venv/bin/pip install --quiet cyclonedx-bom==7.5.0
          sbom-venv/bin/cyclonedx-py environment --spec-version 1.6 --output-format JSON \
            --output-file sbom.marvin.cdx.json marvin-venv/bin/python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-marvin
          path: sbom.marvin.cdx.json
